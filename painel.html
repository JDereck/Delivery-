<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Delivery</title>
  <link rel="stylesheet" href="painel.css">
</head>
<body>

  <header>
    <div class="header-left">
      <h1>📋 Painel</h1>
      <span id="status-loja" class="badge-status"></span>
    </div>
    <div class="header-right">
      <span id="ultima-atualizacao" class="update-time"></span>
      <button id="btn-refresh" class="btn-icon" title="Atualizar agora">↻</button>
    </div>
  </header>

  <!-- Resumo do dia -->
  <div class="resumo-dia">
    <div class="resumo-card">
      <span class="resumo-label">Pedidos hoje</span>
      <span class="resumo-valor" id="total-pedidos">—</span>
    </div>
    <div class="resumo-card">
      <span class="resumo-label">Faturamento</span>
      <span class="resumo-valor accent" id="total-faturamento">—</span>
    </div>
    <div class="resumo-card">
      <span class="resumo-label">Em aberto</span>
      <span class="resumo-valor warn" id="total-aberto">—</span>
    </div>
    <div class="resumo-card">
      <span class="resumo-label">Cancelados</span>
      <span class="resumo-valor danger" id="total-cancelados">—</span>
    </div>
  </div>

  <!-- Filtros -->
  <nav class="filtros">
    <button class="filtro active" data-status="todos">Todos</button>
    <button class="filtro novo"       data-status="Novo">Novos</button>
    <button class="filtro preparo"    data-status="Em Preparo">Em Preparo</button>
    <button class="filtro saiu"       data-status="Saiu pra Entrega">Saiu</button>
    <button class="filtro entregue"   data-status="Entregue">Entregue</button>
    <button class="filtro cancelado"  data-status="Cancelado">Cancelado</button>
  </nav>

  <!-- Grid de pedidos -->
  <main id="pedidos-grid" class="pedidos-grid">
    <p class="loading">⏳ Carregando pedidos...</p>
  </main>

  <!-- Modal de cancelamento -->
  <div id="modal-cancelar" class="modal hidden">
    <div class="modal-box">
      <h3>Cancelar pedido</h3>
      <p id="modal-nome-pedido" class="modal-sub"></p>
      <textarea id="motivo-cancelamento" placeholder="Motivo do cancelamento (opcional)" rows="3"></textarea>
      <div class="modal-acoes">
        <button id="btn-confirmar-cancelar" class="btn-danger">Confirmar cancelamento</button>
        <button id="btn-fechar-modal" class="btn-ghost">Voltar</button>
      </div>
    </div>
  </div>

  <script src="painel.js"></script>
</body>
</html>
